# Default configuration. Every key can be overridden by an environment variable
# named NEWS_<SECTION>_<KEY>, for example NEWS_MONGO_URI or NEWS_SERVER_PORT.
# Unknown keys are rejected at startup, so a typo fails fast instead of being
# silently ignored.

app:
  name: news-collector
  environment: development

server:
  host: 0.0.0.0
  port: 8080
  read_header_timeout: 5s
  read_timeout: 15s
  write_timeout: 30s
  idle_timeout: 60s
  shutdown_timeout: 15s
  max_header_bytes: 1048576

# Guards every /api/v1 route; /health stays open for probes. A request is
# accepted if it carries a known API key in api_key_header, or valid HTTP basic
# credentials. The credentials themselves are deliberately absent from this
# file: they are read only from the environment, which .env feeds locally and
# the platform injects in deployment.
#
#   NEWS_AUTH_API_KEYS         comma-separated, so a key can be rotated in
#   NEWS_AUTH_BASIC_USERNAME
#   NEWS_AUTH_BASIC_PASSWORD
#
# Starting with this on and no credentials set is a startup error, by design.
auth:
  enabled: true
  api_key_header: X-API-Key

mongo:
  uri: mongodb://localhost:27017
  database: news
  connect_timeout: 10s
  server_selection_timeout: 10s
  operation_timeout: 30s
  max_pool_size: 50
  min_pool_size: 0

collector:
  user_agent: news-collector/1.0 (+https://github.com/riaz/newscollector)
  request_timeout: 20s
  max_response_bytes: 10485760
  max_redirects: 5
  max_items_per_feed: 500
  # Never enable this outside local development: it disables the guard that
  # stops a feed URL reaching a private or link-local address.
  allow_private_networks: false

scheduler:
  enabled: true
  interval: 60s
  batch_size: 50
  max_concurrent: 4
  # Must outlast a collection, or a second collector could start one while the
  # first is still fetching.
  lock_ttl: 5m

logging:
  level: info
  format: json
