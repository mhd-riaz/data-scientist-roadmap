# Default configuration. Every key can be overridden by an environment variable
# named NEWS_<SECTION>_<KEY>, for example NEWS_MONGO_URI or NEWS_SERVER_PORT.
# Unknown keys are rejected at startup, so a typo fails fast instead of being
# silently ignored.

app:
  name: news-collector
  environment: development

server:
  host: 0.0.0.0
  port: 8080
  read_header_timeout: 5s
  read_timeout: 15s
  write_timeout: 30s
  idle_timeout: 60s
  shutdown_timeout: 15s
  max_header_bytes: 1048576

mongo:
  uri: mongodb://localhost:27017
  database: news
  connect_timeout: 10s
  server_selection_timeout: 10s
  operation_timeout: 30s
  max_pool_size: 50
  min_pool_size: 0

logging:
  level: info
  format: json
