name: news-collector

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Runs to completion before the API starts, then exits.
  migrate:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    entrypoint: ["/app/migrate"]
    environment:
      NEWS_MONGO_URI: mongodb://mongo:27017
      NEWS_MONGO_DATABASE: news
      NEWS_LOGGING_FORMAT: json
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NEWS_SERVER_HOST: 0.0.0.0
      NEWS_SERVER_PORT: "8080"
      NEWS_MONGO_URI: mongodb://mongo:27017
      NEWS_MONGO_DATABASE: news
      NEWS_APP_ENVIRONMENT: development
      NEWS_LOGGING_LEVEL: info
      NEWS_LOGGING_FORMAT: json
    depends_on:
      mongo:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo-data:
